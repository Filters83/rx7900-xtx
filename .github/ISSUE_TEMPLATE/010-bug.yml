name: Bug report
description: Something fails or gives wrong output with the NariQ files or this fork's binaries.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for the report. If the same problem happens with a stock (non-NariQ) GGUF in upstream llama.cpp,
        please report it [upstream](https://github.com/ggml-org/llama.cpp/issues) instead.
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Output of `llama-server --version`, and the release tag or commit you use.
      placeholder: |
        $ ./llama-server --version
        version: 1.0.0-dev (build 12431, commit 30f794c)
        built with GNU 11.4.0 for Linux x86_64
        release b12431-nariv0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      multiple: true
      options:
        - run.sh / run.ps1
        - Release archive, Linux
        - Release archive, Windows
        - Docker image
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model file
      multiple: true
      options:
        - 3.0bpw
        - 2.5bpw
        - 2.0bpw
        - mmproj (vision)
        - My own converted file
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and system
      description: GPU model and memory, driver version, operating system. `nvidia-smi` output is enough on NVIDIA.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line
      description: The exact command you ran. Formatted as code automatically.
      render: shell
  - type: textarea
    id: info
    attributes:
      label: What happened, and how to reproduce it
      description: What you expected, what you got, and the steps that trigger it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        Relevant log lines, including the startup log. Upload long logs as a file (`--log-file`, or append
        ` > llama.log 2>&1` to the command).
      render: console
